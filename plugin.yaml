# Hermie plugin manifest.
#
# `name` is the registry id: every config key this plugin reads lives under
# `plugins.entries.hermie.settings.*`, and every ui_meta key it writes is
# `hermie-plugin`. Changing it renames both, so it does not change.
name: hermie
manifest_version: 1
version: 0.13.0
description: >-
  Hermie's gateway-side companion: push notifications for bot messages, approval
  and clarify requests (and, where the gateway reports them, secure inputs,
  confirmations and passkey changes), and cron deliveries, plus a `/me` command that says who
  the gateway thinks it is talking to and how it worked that out. Registrations
  and settings live in the gateway's own profile ui_meta. Notifications go out
  through Expo, Web Push, or the Hermie push relay for the native Apple apps,
  and message text never crosses the relay in the clear. Also carries a build of
  Hermie's web client, which the dashboard serves from its own static route at
  /dashboard-plugins/hermie/app/index.html behind its own sign-in; the plugin
  checks the files against their build manifest at load and advertises the
  client only when they match.
author: FullStack Studio
license: MIT
homepage: https://github.com/fullstackstudio-org/hermie-plugin
kind: standalone
tags:
  - notifications
  - push
  - hermie
platforms:
  - linux
  - macos
  - windows

# No third-party packages. Web Push signing uses `cryptography`, which ships in
# the Hermes runtime; the plugin degrades to Expo-only when it is absent.
python_dependencies: []

# `hooks` is the human-facing list; `provides_hooks` is what `hermes plugins
# doctor` checks the registration against, so the two are kept identical.
#
# These are the hooks every gateway has. Five more are registered only on a
# gateway whose own list of hooks names them, and are declared under
# `optional_hooks`, a sibling key a gateway that supports it checks apart from
# `provides_hooks`: `pre_confirm_request` and `on_passkey_change` (the fork's: a
# `confirm` request opened, a passkey added or revoked), and
# `pre_server_request`, `post_server_request` and `on_background_complete`
# (named for the fork to implement; no gateway fires them yet). None is
# listened to where it is unknown, and the push types they feed stay quiet. A
# gateway without `optional_hooks` support ignores the key.
hooks: &hooks
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
provides_hooks: *hooks
optional_hooks:
  - pre_confirm_request
  - on_passkey_change
  - pre_server_request
  - post_server_request
  - on_background_complete

# Declared for `hermes plugins show`; the app reads the live set from ui_meta.
emits: []
listens: []

config_schema:
  modules.push:
    type: bool
    default: true
    description: "Send push notifications to registered devices."
  modules.context:
    type: bool
    default: true
    description: "Work out who is sending a turn, and answer /me about it."
  modules.memory:
    type: bool
    default: true
    description: "Serve the memory browser routes on the dashboard."
  modules.web:
    type: bool
    default: true
    description: >-
      Advertise the web client bundled in dashboard/app/ (capability
      web.client and the advert's web block), once its files matched their
      build.json at load. Off withdraws the advert only: the dashboard still
      serves the files to whoever it lets in.
  memory.browse:
    type: bool
    default: true
    description: >-
      Let a signed-in dashboard caller read this profile's MEMORY.md and
      USER.md through /api/plugins/hermie/memory/ — as entries, and as the
      files are stored.
  memory.edit:
    type: bool
    default: true
    description: >-
      Let that caller add, replace and remove entries as well. Has no effect
      while memory.browse is off.
  profiles.edit:
    type: bool
    default: true
    description: >-
      Let a signed-in dashboard caller set a profile's display name through
      /api/plugins/hermie/profiles/{name} — the presentation label only, never
      the profile's canonical id, its directory or any other file.
  push.types:
    type: list
    default: ["message", "request", "cron", "cron_done", "cron_failed", "turn_done", "turn_failed"]
    description: >-
      Event types this gateway may notify about at all. `cron` is a scheduled
      job delivering something, `cron_done` and `cron_failed` are that job's
      turn ending.
  push.preview:
    type: str
    default: "device"
    description: >-
      Whether a payload may carry message text: "never" forbids it gateway-wide,
      "device" honours each registration's own `preview` flag.
  push.attached_window_seconds:
    type: int
    default: 90
    description: "How recent a device's `seen` heartbeat must be to suppress a message notification."
  push.delay_seconds:
    type: int
    default: 5
    description: "Grace period before a message notification is sent, so an opening app can claim it."
  push.public_url:
    type: str
    default: ""
    description: >-
      The absolute base URL this gateway is reached on from outside, used to
      name it in a notification payload. Empty falls back to Hermes' own
      dashboard.public_url. Only consulted for a device that registered before
      the app started writing the key itself.
  push.relay_origins:
    type: list
    default: ["https://push.hermie.dev"]
    description: >-
      The push relays this gateway may post to, as https origins. A device
      registered with any other relay is not sent to. Setting this replaces
      the default; an empty list serves no relay at all.
  push.vapid_key_path:
    type: str
    default: ""
    description: "PEM file holding the Web Push VAPID private key. Empty means the plugin's state directory."
  push.vapid_contact:
    type: str
    default: ""
    description: "mailto: or https: contact put in the VAPID JWT `sub` claim."
  context.session_vars:
    type: bool
    default: true
    description: >-
      Fill in Hermes' own HERMES_SESSION_USER_ID for a turn when it is empty
      and the plugin can say who is asking, correcting it (and blanking
      _ID_ALT and _NAME, which this plugin no longer has anything to put in
      them) when it names somebody else.
  update.check:
    type: bool
    default: false
    description: >-
      Ask this plugin's own repository, at most once an hour, whether a newer
      release exists, and put the answer in the advert. Off by default: the
      advert already carries this build's version and installed commit, which
      is enough for the app to work that out on its own network. Nothing
      identifying is sent either way.
