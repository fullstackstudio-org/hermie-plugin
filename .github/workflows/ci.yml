name: CI

# `main` deploys itself to the gateways within about fifteen minutes of a push, so
# this runs before a change is merged (pull_request) and again on what landed
# (push). Branch protection is what makes "before" binding: see README.md,
# "Branch protection". The required checks are the job names `test` and
# `guard-scan`.
#
# Needs no secret and asks for none. It runs on GitHub-hosted runners (the
# organisation's self-hosted runner serves private repositories only) and on
# `pull_request`, never `pull_request_target`, so a fork's change is checked
# without ever running with this repository's credentials.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository, an issue or a check.
permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces the older run. Runs on main
  # are never cancelled: every commit that deploys keeps its own result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The versions Hermes locks; the file says why they are not the newest.
      - name: Install
        run: python -m pip install --disable-pip-version-check --no-input -r .github/requirements-ci.txt

      # No linter or type checker is configured for this repository, so there is
      # none to run. A syntax error in a file no test imports still fails here.
      - name: Every module compiles
        run: python -m compileall -q -x '/\.git/' .

      - name: Tests
        shell: bash
        run: python -m pytest --rootdir=tests tests -q -rs | tee "$RUNNER_TEMP/pytest.log"

      # A test that skips counts as green, and a dependency that stops importing
      # makes whole files skip. The skips that are expected are the ones that need
      # a real Hermes or a checkout of another repository (CONTRIBUTING.md lists
      # them). Any other reason is a gap in what this run proves, so it fails.
      - name: No unexpected skips
        shell: bash
        run: |
          unexpected=$(grep '^SKIPPED' "$RUNNER_TEMP/pytest.log" \
            | grep -v -e 'hermes is not importable here' \
                      -e 'needs Hermes itself' \
                      -e 'the app repository' \
                      -e "the relay's source is not checked out" \
            || true)
          if [ -n "$unexpected" ]; then
            echo "Skipped for a reason this job does not expect:"
            echo "$unexpected"
            exit 1
          fi

  guard-scan:
    name: guard-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Hermes re-scans this tree after every `hermes plugins update`, and a
      # `dangerous` verdict disables the plugin on that gateway: push included.
      # This runs the scanner the way that update does, with the fork and with
      # upstream at the commits in .github/scanner-pins.json, over this checkout.
      # Anything but `safe` fails the job. The scanners are put outside the tree
      # so they are not scanned themselves.
      - name: Scan the tree with the pinned scanners
        run: python scripts/guard_scan.py --workdir "$RUNNER_TEMP/scanners"

  # PLACEHOLDER, NOT YET ACTIVE. The real job lands with the web client's bundle
  # (the plan's P-2): it checks the app repository out at the commit
  # `dashboard/app/build.json` names, requires that commit to be an ancestor of the
  # app's main, rebuilds the client and compares every byte with `dashboard/app/`.
  # Until then it verifies nothing about a bundle. It is a required check anyway,
  # under the name it will keep, because the one thing true today is worth
  # enforcing: it refuses a bundle that arrives before the verification exists, so
  # an unverified build cannot be merged by accident. Its name stays exactly
  # `web-bundle-verify` so that branch protection need not change when the real
  # job replaces this one.
  web-bundle-verify:
    name: web-bundle-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Placeholder, not yet active: refuse a client bundle until it can be verified"
        shell: bash
        run: |
          # -L as well as -e: a dangling symlink is not "existing" to -e.
          if [ -e dashboard/app ] || [ -L dashboard/app ]; then
            echo "::error::dashboard/app exists, but the job that rebuilds and verifies a bundle is not implemented yet. Do not merge a bundle without it."
            exit 1
          fi
          echo "::notice::web-bundle-verify is a placeholder. No client bundle is present, and none is verified by this job yet."
