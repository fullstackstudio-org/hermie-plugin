name: CI

# `main` deploys itself to the gateways within about fifteen minutes of a push, so
# this runs before a change is merged (pull_request) and again on what landed
# (push). Branch protection is what makes "before" binding: see README.md,
# "Branch protection". The required checks are the job names `test`,
# `guard-scan` and `web-bundle-verify`.
#
# Needs no secret and asks for none. It runs on GitHub-hosted runners (the
# organisation's self-hosted runner serves private repositories only) and on
# `pull_request`, never `pull_request_target`, so a fork's change is checked
# without ever running with this repository's credentials.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository, an issue or a check.
permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces the older run. Runs on main
  # are never cancelled: every commit that deploys keeps its own result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The versions Hermes locks; the file says why they are not the newest.
      - name: Install
        run: python -m pip install --disable-pip-version-check --no-input -r .github/requirements-ci.txt

      # No linter or type checker is configured for this repository, so there is
      # none to run. A syntax error in a file no test imports still fails here.
      - name: Every module compiles
        run: python -m compileall -q -x '/\.git/' .

      - name: Tests
        shell: bash
        run: python -m pytest --rootdir=tests tests -q -rs | tee "$RUNNER_TEMP/pytest.log"

      # A test that skips counts as green, and a dependency that stops importing
      # makes whole files skip. The skips that are expected are the ones that need
      # a real Hermes or a checkout of another repository (CONTRIBUTING.md lists
      # them). Any other reason is a gap in what this run proves, so it fails.
      - name: No unexpected skips
        shell: bash
        run: |
          unexpected=$(grep '^SKIPPED' "$RUNNER_TEMP/pytest.log" \
            | grep -v -e 'hermes is not importable here' \
                      -e 'needs Hermes itself' \
                      -e 'the app repository' \
                      -e "the relay's source is not checked out" \
            || true)
          if [ -n "$unexpected" ]; then
            echo "Skipped for a reason this job does not expect:"
            echo "$unexpected"
            exit 1
          fi

  guard-scan:
    name: guard-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Hermes scans the new version of this tree before `hermes plugins update`
      # applies it, and a verdict short of `safe` refuses the update on that
      # gateway. This runs the scanner the way that update does, with the fork
      # and with upstream at the commits in .github/scanner-pins.json, over this
      # checkout. The fork is the blocking gate (anything but `safe` fails);
      # upstream is informational (only `dangerous` fails) and its verdict goes
      # into the step summary. The scanners are put outside the tree so they are
      # not scanned themselves.
      - name: Scan the tree with the pinned scanners
        run: python scripts/guard_scan.py --workdir "$RUNNER_TEMP/scanners"

  # The web client in dashboard/app/ is the build of reviewed, merged source, byte
  # for byte. The job checks the bundle against its own build.json (the rules the
  # plugin applies at load, plus the import limits), checks the app repository out
  # at the commit build.json names, refuses that commit unless it is on the app's
  # main, rebuilds the client there with the Node version the app pins, and
  # compares every file of the rebuild, build.json included, with dashboard/app/.
  # A bundle that is not exactly the build of merged source cannot pass.
  #
  # With no dashboard/app/ at all there is nothing to verify and the job passes:
  # a plugin without a client is a valid plugin. Its name stays exactly
  # `web-bundle-verify`; branch protection requires it under that name.
  web-bundle-verify:
    name: web-bundle-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The one repository a bundle may be built from. A pull request writes
      # build.json, so the source it names is compared with this rather than
      # trusted: a bundle naming a repository of its author's choosing would
      # otherwise pass by rebuilding itself.
      APP_REPO: fullstackstudio-org/hermie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Check the bundle against its build.json and read its source
        id: source
        working-directory: plugin
        shell: bash
        run: |
          python3 scripts/import_web_client.py --check > "$RUNNER_TEMP/bundle.txt"
          cat "$RUNNER_TEMP/bundle.txt"
          if [ "$(sed -n 's/^present=//p' "$RUNNER_TEMP/bundle.txt")" != "true" ]; then
            echo "::notice::There is no dashboard/app/, so there is no client bundle to verify."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo=$(sed -n 's/^repo=//p' "$RUNNER_TEMP/bundle.txt")
          commit=$(sed -n 's/^commit=//p' "$RUNNER_TEMP/bundle.txt")
          if [ "$repo" != "$APP_REPO" ]; then
            echo "::error::build.json names $repo as its source. A bundle must be built from $APP_REPO."
            exit 1
          fi
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::build.json names no full source commit."
            exit 1
          fi
          { echo "present=true"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"

      # The app repository is public: the checkout needs no credential beyond the
      # job's own read-only one, and keeps none in the workspace.
      - name: Check the app repository out at that commit
        if: steps.source.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ steps.source.outputs.commit }}
          path: app
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Refuse a commit that is not on the app's main
        if: steps.source.outputs.present == 'true'
        working-directory: app
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          git fetch --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$COMMIT" ]; then
            echo "::error::The checkout is not at $COMMIT."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo "::error::$COMMIT is not on the main branch of $APP_REPO. A bundle is built only from merged source."
            exit 1
          fi
          echo "$COMMIT is on the main branch of $APP_REPO."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.source.outputs.present == 'true'
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Rebuild the client from that commit
        if: steps.source.outputs.present == 'true'
        working-directory: app
        shell: bash
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run client:build

      - name: Compare the rebuild with dashboard/app, file by file
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          if diff -r -q --no-dereference app/native/web/dist plugin/dashboard/app; then
            echo "dashboard/app is the build of that commit, byte for byte."
            exit 0
          fi
          echo "::error::dashboard/app is not the build of the commit its build.json names."
          for side in app/native/web/dist plugin/dashboard/app; do
            echo "--- $side"
            (cd "$side" && find . -type f -print0 | sort -z | xargs -0 sha256sum)
          done
          exit 1
